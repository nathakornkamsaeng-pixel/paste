<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="650" height="240" role="img" aria-label="Everlyce paste">
  <defs>
    <linearGradient id="lockupGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a6b"/>
      <stop offset="0.55" stop-color="#24518f"/>
      <stop offset="1" stop-color="#2f7ad4"/>
    </linearGradient>
    <linearGradient id="lockupSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(16 44) scale(0.296875)">
    <rect width="512" height="512" rx="112" fill="url(#lockupGradient)"/>
    <rect width="512" height="256" rx="112" fill="url(#lockupSheen)"/>
    <g fill="#f8f9fb">
      <rect x="128" y="96" width="80" height="320" rx="40"/>
      <rect x="128" y="96" width="256" height="80" rx="40"/>
      <rect x="128" y="336" width="256" height="80" rx="40"/>
    </g>
    <rect x="128" y="216" width="192" height="80" rx="40" fill="#a78bfa"/>
  </g>

  <!--
    Lockup structure copied from the Everlyce POS social card: the parent word
    large and near-white, the product word beneath it in the accent, tracked
    out. Same hierarchy, so the two cards sit together without one upstaging
    the other.
  -->
  <text x="196" y="112"
        font-family="Inter Display, Inter, DejaVu Sans, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2.5"
        fill="#f8f9fb">Everlyce</text>

  <text x="200" y="170"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="42" font-weight="600" letter-spacing="9"
        fill="#a78bfa">paste</text>
</svg>
