<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="650" height="240" role="img" aria-label="paste">
  <defs>
    <linearGradient id="lockupGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3563b8"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <linearGradient id="lockupSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lockupWord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf9"/>
      <stop offset="1" stop-color="#c3cee2"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(16 16) scale(0.40625)">
    <rect width="512" height="512" rx="112" fill="url(#lockupGradient)"/>
    <rect width="512" height="256" rx="112" fill="url(#lockupSheen)"/>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="none"
          stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>
    <g fill="#ffffff">
      <rect x="155" y="104" width="62" height="304" rx="31"/>
      <path d="M186 184 H252 a80 80 0 0 1 0 160 H186" fill="none" stroke="#ffffff"
            stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark. Shares everlyce.com's stack and optical treatment: a heavy
       system sans with tightened tracking, so it sits on the same baseline
       rhythm as the POS wordmark. -->
  <text x="256" y="160"
        font-family="Inter Display, Inter, DejaVu Sans, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-6"
        fill="url(#lockupWord)">paste</text>
</svg>
