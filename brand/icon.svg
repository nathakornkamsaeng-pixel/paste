<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Everlyce paste">
  <defs>
    <!-- pos.everlyce.com's tile gradient, verbatim. Paste is a sibling
         product, so it wears the same blue the POS app icon does. -->
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a6b"/>
      <stop offset="0.55" stop-color="#24518f"/>
      <stop offset="1" stop-color="#2f7ad4"/>
    </linearGradient>
    <linearGradient id="markSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rx 112 = 14/64, the corner radius every Everlyce mark uses. -->
  <rect width="512" height="512" rx="112" fill="url(#markGradient)"/>
  <rect width="512" height="256" rx="112" fill="url(#markSheen)"/>

  <!--
    The Everlyce "E": a stem with three bars, the middle one short and
    accented. Constructed from rounded rects rather than a filled path, the
    way pos.everlyce.com draws it, so the terminals stay as soft as the tile
    and the glyph still holds at 16px.

    Grid is the POS 64-unit mark scaled x8, so the proportions are identical:
    bars 32/64 wide, middle bar 24/64, gaps 5/64.
  -->
  <g fill="#f8f9fb">
    <rect x="128" y="96" width="80" height="320" rx="40"/>
    <rect x="128" y="96" width="256" height="80" rx="40"/>
    <rect x="128" y="336" width="256" height="80" rx="40"/>
  </g>
  <!-- The accent bar. POS uses green for its own product; paste takes the
       violet that everlyce.com's own mark carries, lightened to #a78bfa so it
       still separates from the blue tile at favicon sizes. -->
  <rect x="128" y="216" width="192" height="80" rx="40" fill="#a78bfa"/>
</svg>
