<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Everlyce paste — share text and code">
  <defs>
    <!-- The Everlyce POS social card's backdrop: deep navy at the top left
         opening out to the brand blue at the bottom right. -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#16305c"/>
      <stop offset="1" stop-color="#2f6bd0"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.86" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardMarkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a6b"/>
      <stop offset="0.55" stop-color="#24518f"/>
      <stop offset="1" stop-color="#2f7ad4"/>
    </linearGradient>
    <linearGradient id="cardSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cardBg)"/>
  <rect width="1200" height="630" fill="url(#cardGlow)"/>

  <!-- Mark -->
  <g transform="translate(96 168) scale(0.328125)">
    <rect width="512" height="512" rx="112" fill="url(#cardMarkGradient)"/>
    <rect width="512" height="256" rx="112" fill="url(#cardSheen)"/>
    <g fill="#f8f9fb">
      <rect x="128" y="96" width="80" height="320" rx="40"/>
      <rect x="128" y="96" width="256" height="80" rx="40"/>
      <rect x="128" y="336" width="256" height="80" rx="40"/>
    </g>
    <rect x="128" y="216" width="192" height="80" rx="40" fill="#a78bfa"/>
  </g>

  <!-- Lockup, same hierarchy as the POS card. -->
  <text x="316" y="308"
        font-family="Inter Display, Inter, DejaVu Sans, sans-serif"
        font-size="88" font-weight="700" letter-spacing="-3"
        fill="#f8f9fb">Everlyce</text>

  <text x="320" y="386"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="52" font-weight="600" letter-spacing="11"
        fill="#a78bfa">paste</text>

  <text x="96" y="536"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="36" font-weight="400"
        fill="rgba(248, 249, 251, 0.82)">Point of paste that runs itself</text>

  <text x="96" y="580"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="27" font-weight="400"
        fill="rgba(248, 249, 251, 0.58)">share text and code, no account needed</text>
</svg>
