<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="paste">
  <defs>
    <!-- Flatter than icon.svg on purpose: no sheen and no hairline border, so
         maximum contrast survives at 16px in a tab strip. The mid stop is
         pushed a shade lighter for the same reason. -->
    <linearGradient id="flat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6cc2"/>
      <stop offset="0.5" stop-color="#5f95ff"/>
      <stop offset="1" stop-color="#754cf0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#flat)"/>

  <g fill="#ffffff">
    <rect x="155" y="104" width="62" height="304" rx="31"/>
    <path d="M186 184 H252 a80 80 0 0 1 0 160 H186" fill="none" stroke="#ffffff"
          stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
